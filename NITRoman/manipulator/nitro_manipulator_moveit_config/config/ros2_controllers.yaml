# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    imax_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

imax_controller:
  ros__parameters:
    joints:
      - yaw_joint
      - first_link_joint
      - second_link_joint
      - third_link_joint
      - hand_pitch
      - hand_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity