joy2command:
  ros__parameters:
    crawler:
      linear:
        x:
          max_velocity: 5.0
      angular:
        z:
          max_velocity: 5.0

    flipper:
      max_velocity: 10.0
      max_acceleration: 5.0
      min_velocity: -10.0
      min_acceleration: -5.0  
      
    manipulator:
      max_linear_velocity: 0.1
      max_angular_velocity: 0.05
    
    drone:
      max_linear_velocity: 0.1
      max_angular_velocity: 0.2

    body:
      max_linear_velocity: 0.01
      max_angular_velocity: 0.1

    head:
      max_linear_velocity: 0.1
      max_angular_velocity: 0.01